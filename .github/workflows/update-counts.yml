name: Update problem counts

on:
  push:
    branches: [main]
    paths:
      - "easy/**"
      - "medium/**"
      - "hard/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update counts in README
        run: python scripts/update_counts.py

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update problem counts"
          git push
